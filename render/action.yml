name: Render private maimai report from local JSON
description: Render an existing private report snapshot without starting a Kamaitachi import

inputs:
  report-input:
    description: Existing report-input.json path relative to the caller workspace
    required: true
  after-pbs:
    description: Existing after-pbs.json path relative to the caller workspace
    required: true
  output:
    description: Report HTML path relative to the caller workspace
    required: false
    default: output/maimai-report.html
  python-version:
    description: Python version used to run the report package
    required: false
    default: "3.11"

outputs:
  report-path:
    description: Report HTML path relative to the caller workspace
    value: ${{ steps.result.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Require a private caller repository
      shell: bash
      env:
        MAIMAI_CALLER_IS_PRIVATE: ${{ github.event.repository.private }}
      run: |
        set -euo pipefail
        [[ "$MAIMAI_CALLER_IS_PRIVATE" == "true" ]] || {
          echo 'Private report rendering is disabled unless the caller repository is private.' >&2
          exit 2
        }

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Validate local render inputs
      shell: bash
      env:
        MAIMAI_REPORT_INPUT: ${{ inputs.report-input }}
        MAIMAI_AFTER_PBS: ${{ inputs.after-pbs }}
      run: |
        set -euo pipefail
        test -s "$MAIMAI_REPORT_INPUT" || { echo "Missing report input: $MAIMAI_REPORT_INPUT" >&2; exit 2; }
        test -s "$MAIMAI_AFTER_PBS" || { echo "Missing after-PBs input: $MAIMAI_AFTER_PBS" >&2; exit 2; }
        [[ -n "${MAIMAI_REPORT_DISPLAY_NAME:-}" ]] || { echo 'MAIMAI_REPORT_DISPLAY_NAME is required' >&2; exit 2; }
        [[ -n "${MAIMAI_REPORT_TIMEZONE:-}" ]] || { echo 'MAIMAI_REPORT_TIMEZONE is required' >&2; exit 2; }
        [[ -n "${MAIMAI_REPORT_CURRENT_VERSION_DISPLAY_NAMES:-}" ]] || { echo 'MAIMAI_REPORT_CURRENT_VERSION_DISPLAY_NAMES is required' >&2; exit 2; }
        python -c 'import json, os; value=json.loads(os.environ["MAIMAI_REPORT_CURRENT_VERSION_DISPLAY_NAMES"]); assert isinstance(value, list) and value and all(isinstance(item, str) and item.strip() for item in value), "MAIMAI_REPORT_CURRENT_VERSION_DISPLAY_NAMES must be a nonempty JSON array of nonempty strings"'

    - name: Install canonical report package
      shell: bash
      env:
        MAIMAI_RENDER_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --no-deps "$MAIMAI_RENDER_ACTION_PATH/.."

    - name: Render existing snapshot without an API request
      shell: bash
      env:
        MAIMAI_REPORT_INPUT: ${{ inputs.report-input }}
        MAIMAI_AFTER_PBS: ${{ inputs.after-pbs }}
        MAIMAI_RENDER_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$MAIMAI_RENDER_OUTPUT")"
        python -m maimai_report render \
          --report-input "$MAIMAI_REPORT_INPUT" \
          --after-pbs "$MAIMAI_AFTER_PBS" \
          --output "$MAIMAI_RENDER_OUTPUT"

    - name: Publish action output path
      id: result
      shell: bash
      env:
        MAIMAI_RENDER_OUTPUT: ${{ inputs.output }}
      run: printf 'report-path=%s\n' "$MAIMAI_RENDER_OUTPUT" >> "$GITHUB_OUTPUT"
