[build-system]
requires = []
build-backend = "maimai_build_backend"
backend-path = ["build_backend"]

[project]
name = "maimai-session-report"
version = "0.1.0"
description = "maimai Session Report: private session reports and rating progress"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "arussin" }]
keywords = ["maimai", "kamaitachi", "myt", "report"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
artwork = ["Pillow==12.3.0"]
history = ["boto3==1.43.89"]
# Stock Windows Python does not ship the IANA timezone database. UTC works
# without this extra; install it only when another IANA timezone needs data.
timezone = ["tzdata>=2025.2"]

[project.scripts]
maimai-report = "maimai_report.cli:main"

[project.urls]
Repository = "https://github.com/arussin/maimai-session-report"
Issues = "https://github.com/arussin/maimai-session-report/issues"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["output", "actions-downloads"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
