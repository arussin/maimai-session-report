name: Build private maimai report
description: Import from MYT or read an existing Kamaitachi session and render a private report

inputs:
  source:
    description: myt to import, or kamaitachi to read an existing session
    default: myt
  session-id:
    description: Existing session ID, latest, or pb-snapshot; required for kamaitachi
    default: ''
  baseline:
    description: Optional local pre-session baseline.json for kamaitachi
    default: ''
  output:
    description: Report HTML path relative to the caller workspace
    required: false
    default: output/maimai-report.html
  python-version:
    description: Python version used to run the report package
    required: false
    default: "3.11"
  artwork:
    description: Prepare embedded jackets from public static artwork at build time (true or false)
    required: false
    default: "true"

outputs:
  report-path:
    description: Report HTML path relative to the caller workspace
    value: ${{ steps.result.outputs.report-path }}

runs:
  using: composite
  steps:
    - name: Require a private caller repository
      shell: bash
      env:
        MAIMAI_CALLER_IS_PRIVATE: ${{ github.event.repository.private }}
      run: |
        set -euo pipefail
        [[ "$MAIMAI_CALLER_IS_PRIVATE" == "true" ]] || {
          echo 'Private report generation is disabled unless the caller repository is private.' >&2
          exit 2
        }

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Validate required secret and configuration
      shell: bash
      env:
        MAIMAI_ACTION_SOURCE: ${{ inputs.source }}
        MAIMAI_ACTION_SESSION: ${{ inputs.session-id }}
        MAIMAI_ACTION_BASELINE: ${{ inputs.baseline }}
      run: |
        set -euo pipefail
        missing=()
        case "$MAIMAI_ACTION_SOURCE" in
          myt)
            [[ -z "$MAIMAI_ACTION_SESSION" && -z "$MAIMAI_ACTION_BASELINE" ]] || { echo 'Session and baseline require source: kamaitachi' >&2; exit 2; }
            [[ -n "${KAMAITACHI_API_TOKEN:-}" ]] || missing+=(KAMAITACHI_API_TOKEN) ;;
          kamaitachi) [[ "$MAIMAI_ACTION_SESSION" =~ ^[A-Za-z0-9_-]{1,128}$ ]] || { echo 'Choose a Kamaitachi session ID, latest, or pb-snapshot' >&2; exit 2; } ;;
          *) echo 'source must be myt or kamaitachi' >&2; exit 2 ;;
        esac
        [[ -n "${MAIMAI_REPORT_USERNAME:-}" ]] || missing+=(MAIMAI_REPORT_USERNAME)
        [[ -n "${MAIMAI_REPORT_DISPLAY_NAME:-}" ]] || missing+=(MAIMAI_REPORT_DISPLAY_NAME)
        [[ -n "${MAIMAI_REPORT_TIMEZONE:-}" ]] || missing+=(MAIMAI_REPORT_TIMEZONE)
        [[ -n "${MAIMAI_REPORT_CURRENT_VERSION_DISPLAY_NAMES:-}" ]] || missing+=(MAIMAI_REPORT_CURRENT_VERSION_DISPLAY_NAMES)
        if (( ${#missing[@]} )); then
          printf 'Missing required secret or environment value: %s\n' "${missing[@]}" >&2
          exit 2
        fi
        python -c 'import json, os; value=json.loads(os.environ["MAIMAI_REPORT_CURRENT_VERSION_DISPLAY_NAMES"]); assert isinstance(value, list) and value and all(isinstance(item, str) and item.strip() for item in value), "MAIMAI_REPORT_CURRENT_VERSION_DISPLAY_NAMES must be a nonempty JSON array of nonempty strings"'

    - name: Install canonical report package
      shell: bash
      env:
        MAIMAI_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check --no-deps "$MAIMAI_ACTION_PATH"

    - name: Validate local configuration without an API request
      shell: bash
      run: python -m maimai_report doctor

    - name: Install optional artwork preparation tools
      if: ${{ inputs.artwork == 'true' }}
      shell: bash
      run: python -m pip install --disable-pip-version-check --only-binary=:all: Pillow==12.3.0

    - name: Generate the selected report
      shell: bash
      env:
        MAIMAI_ACTION_OUTPUT: ${{ inputs.output }}
        MAIMAI_ACTION_ARTWORK: ${{ inputs.artwork }}
        MAIMAI_ACTION_SOURCE: ${{ inputs.source }}
        MAIMAI_ACTION_SESSION: ${{ inputs.session-id }}
        MAIMAI_ACTION_BASELINE: ${{ inputs.baseline }}
      run: |
        set -euo pipefail
        extra=()
        case "$MAIMAI_ACTION_ARTWORK" in
          true) extra+=(--prepare-jackets) ;;
          false) ;;
          *) echo 'artwork must be true or false' >&2; exit 2 ;;
        esac
        if [[ "$MAIMAI_ACTION_SOURCE" == kamaitachi ]]; then
          case "$MAIMAI_ACTION_SESSION" in
            latest) extra+=(--latest) ;;
            pb-snapshot) extra+=(--pb-snapshot) ;;
            *) extra+=(--session-id "$MAIMAI_ACTION_SESSION") ;;
          esac
          if [[ -n "$MAIMAI_ACTION_BASELINE" ]]; then extra+=(--baseline "$MAIMAI_ACTION_BASELINE"); fi
          python -m maimai_report from-kamaitachi --output "$MAIMAI_ACTION_OUTPUT" "${extra[@]}"
        else
          python -m maimai_report sync-and-render --output "$MAIMAI_ACTION_OUTPUT" "${extra[@]}"
        fi

    - name: Publish action output path
      id: result
      shell: bash
      env:
        MAIMAI_ACTION_OUTPUT: ${{ inputs.output }}
      run: printf 'report-path=%s\n' "$MAIMAI_ACTION_OUTPUT" >> "$GITHUB_OUTPUT"
