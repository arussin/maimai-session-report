name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11.14"}
          - {os: ubuntu-latest, python-version: "3.13.7"}
          - {os: windows-latest, python-version: "3.13.7"}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and lint tool
        run: |
          python -m pip --isolated download --disable-pip-version-check --cache-dir "${{ runner.temp }}/pip-cache" --require-hashes --only-binary=:all: -r requirements-dev.lock --dest "${{ runner.temp }}/wheelhouse"
          python -m pip --isolated install --disable-pip-version-check --no-index --find-links "${{ runner.temp }}/wheelhouse" --require-hashes --only-binary=:all: -r requirements-dev.lock
          python -m pip --isolated install --disable-pip-version-check --no-index --no-deps .

      - name: Lint and check formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Run offline unit tests
        run: python scripts/run_offline_tests.py

      - name: Smoke-test commands without credentials or network
        run: |
          maimai-report --version
          maimai-report doctor
          maimai-report demo --output ci-output/demo-report.html
          python -m maimai_report demo --scenario empty --output ci-output/empty-report.html
          maimai-report demo --no-support --output ci-output/sealed-report.html

      - name: Validate sealed reports and the exact checkout origin allowance
        run: |
          python -c "from pathlib import Path; from maimai_report.render import validate_generated_html; files = list(Path('ci-output').glob('*.html')); assert len(files) == 3; [validate_generated_html(path.read_text(encoding='utf-8')) for path in files]"
          python -c "from pathlib import Path; from maimai_report.render import validate_generated_html, SEALED_CONTENT_SECURITY_POLICY; html = Path('ci-output/sealed-report.html').read_text(encoding='utf-8'); validate_generated_html(html); assert SEALED_CONTENT_SECURITY_POLICY in html; assert 'support-checkout-dialog' not in html"

  cloudflare-adapter:
    name: Optional Cloudflare adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json

      - name: Install pinned adapter tools
        working-directory: deploy/cloudflare
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test adapter locally
        working-directory: deploy/cloudflare
        run: npm run check

      - name: Test the B50 public catalogue contract offline
        run: node --test tests/tomomai-catalog.test.mjs

  presentation:
    name: Synthetic browser presentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.7"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.1"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install pinned test tools
        run: |
          python -m pip --isolated download --disable-pip-version-check --cache-dir "$RUNNER_TEMP/pip-cache" --require-hashes --only-binary=:all: -r requirements-dev.lock --dest "$RUNNER_TEMP/wheelhouse"
          python -m pip --isolated install --disable-pip-version-check --no-index --find-links "$RUNNER_TEMP/wheelhouse" --require-hashes --only-binary=:all: -r requirements-dev.lock
          python -m pip --isolated install --disable-pip-version-check --no-index --no-deps .
          npm ci --ignore-scripts --no-audit --no-fund --prefix tests/browser
          npm ci --ignore-scripts --no-audit --no-fund --prefix deploy/cloudflare
          cd tests/browser
          npx playwright install --with-deps chromium firefox webkit
      - name: Generate fictional inputs without credentials or score requests
        run: |
          python tests/browser/prepare.py
          python -m tests.history_fixture tests/browser/generated/history
          python -m tests.prepare_installation tests/browser/generated/installations
      - name: Verify default-deny browser network boundary
        working-directory: tests/browser
        run: node --test isolation.test.mjs
      - name: Verify browser behavior and accessibility
        working-directory: tests/browser
        run: npm test
      - name: Retain only synthetic browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-presentation-evidence
          path: tests/browser/synthetic-results/
          retention-days: 7

  installation:
    name: Packaged private installation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: _core
          persist-credentials: false
      - name: Build and consume the seven-file installation package
        env:
          CORE_REVISION: ${{ github.sha }}
        run: |
          python3 _core/scripts/package_installation.py --commit "$CORE_REVISION" --output dist/maimai-installation.zip
          python3 -m zipfile -e dist/maimai-installation.zip .
      - name: Exercise the real composite action as a fresh caller without secrets
        uses: ./_core/installation
        with:
          operation: validate
      - name: Install checksum-pinned workflow linter
        run: |
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Check product and shipped caller workflow syntax and expressions
        run: '"$RUNNER_TEMP/actionlint" -shellcheck="" _core/.github/workflows/*.yml .github/workflows/*.yml'
      - name: Retain the synthetic installation files and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maimai-installation-package
          path: dist/maimai-installation.zip*
          retention-days: 14


  compatibility:
    name: Pinned reciprocal contract and reproducibility
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: report
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11.14'
      - name: Read the reviewed registry counterpart pin
        id: counterpart
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          pin=json.loads(Path('report/config/compatibility.json').read_text())['registry']
          assert pin['repository']=='arussin/maimai-chart-browser'
          assert re.fullmatch('[a-f0-9]{40}',pin['revision'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('revision='+pin['revision']+'\n')
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: arussin/maimai-chart-browser
          ref: ${{ steps.counterpart.outputs.revision }}
          path: registry
          fetch-depth: 0
          persist-credentials: false
      - name: Exercise the real producer and report consumer offline
        shell: bash
        run: python registry/scripts/check_report_compatibility.py --registry registry --report report --candidate report --output "$RUNNER_TEMP/compatibility"
      - name: Canonical Linux build after pinned acquisition
        if: runner.os == 'Linux'
        shell: bash
        run: python registry/scripts/run_canonical_reproduction.py --source report --toolkit registry --output "$RUNNER_TEMP/reproduction"
      - name: Independent Windows archive and entry proof
        if: runner.os == 'Windows'
        shell: bash
        run: python registry/scripts/verify_reproducible_build.py --source report --output "$RUNNER_TEMP/reproduction/proof"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: report-contract-${{ runner.os }}
          path: |
            ${{ runner.temp }}/compatibility/receipt.json
            ${{ runner.temp }}/compatibility/check-*.log
            ${{ runner.temp }}/reproduction/acquisition.json
            ${{ runner.temp }}/reproduction/proof/receipt.json
          retention-days: 14

  cross-os-artifacts:
    name: Compare Linux and Windows wheel contents
    needs: compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: report-contract-*
          path: receipts
      - name: Require identical portable package contents
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          paths=sorted(Path('receipts').glob('**/proof/receipt.json'))
          assert len(paths)==2, paths
          left,right=(json.loads(path.read_text()) for path in paths)
          assert left['passed'] and right['passed']
          assert left['builds'][0]['wheel_entries']==right['builds'][0]['wheel_entries']
          print('Linux and Windows wheel member hashes match; each local archive reproduction passed.')
          PY
